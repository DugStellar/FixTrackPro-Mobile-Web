
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cape IT Assist | FixTrack Pro</title>

    <style>
        :root {
            --primary: #0056b3;
            --dark: #1e293b;
            --light: #f8fafc;
            --accent: #0284c7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: var(--light);
            color: var(--dark);
        }

        header {
            background: var(--primary);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,.1);
            margin-bottom: 1rem;
        }

        h2 {
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: .5rem;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: .75rem;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font: inherit;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: .8rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        button:hover {
            background: var(--accent);
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .status {
            margin-top: 1rem;
            overflow-wrap: anywhere;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Cape IT Assist - FixTrack Pro</h1>
        <p>Client Repair Workflows &amp; Event Registration Portal</p>
    </header>

    <main class="container grid">
        <section class="card">
            <h2>Event RSVP</h2>

            <form id="rsvpForm">
                <div class="form-group">
                    <label for="rsvpName">Full Name</label>
                    <input id="rsvpName" type="text"
                           maxlength="100" required
                           placeholder="e.g. John Doe">
                </div>

                <div class="form-group">
                    <label for="rsvpEmail">Email Address</label>
                    <input id="rsvpEmail" type="email"
                           maxlength="100" required
                           placeholder="john@example.com">
                </div>

                <div class="form-group">
                    <label for="attending">Attending Event?</label>
                    <select id="attending">
                        <option value="Yes">Yes, I will attend</option>
                        <option value="No">No, I cannot attend</option>
                    </select>
                </div>

                <button type="submit">Submit RSVP</button>
                <p id="rsvpStatus" class="status" role="status"></p>
            </form>
        </section>

        <section class="card">
            <h2>New Client Registration</h2>

            <form id="registerForm">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <input id="regName" type="text"
                           maxlength="100" required
                           placeholder="e.g. Jane Smith">
                </div>

                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input id="regEmail" type="email"
                           maxlength="100" required
                           placeholder="jane@example.com">
                </div>

                <div class="form-group">
                    <label for="regPhone">Phone Number</label>
                    <input id="regPhone" type="tel"
                           maxlength="20" required
                           placeholder="082 123 4567">
                </div>

                <button type="submit">Register Account</button>
                <p id="registerStatus" class="status" role="status"></p>
            </form>
        </section>
    </main>

    <script>
        const API_URL = 'api/register.php';

        async function submitForm(form, payload, statusElement) {
            const button = form.querySelector('button[type="submit"]');

            button.disabled = true;
            statusElement.textContent = 'Submitting...';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (!response.ok || result.status !== 'success') {
                    throw new Error(
                        result.message || 'Submission failed.'
                    );
                }

                statusElement.textContent = result.message;
                form.reset();

            } catch (error) {
                console.error(error);

                statusElement.textContent =
                    'Submission failed. Check XAMPP and the API URL, then try again.';
            } finally {
                button.disabled = false;
            }
        }

        document.getElementById('rsvpForm').addEventListener(
            'submit', function (event) {
                event.preventDefault();

                submitForm(this, {
                    full_name: document.getElementById('rsvpName').value.trim(),
                    email: document.getElementById('rsvpEmail').value.trim(),
                    attending_status: document.getElementById('attending').value
                }, document.getElementById('rsvpStatus'));
            }
        );

        document.getElementById('registerForm').addEventListener(
            'submit', function (event) {
                event.preventDefault();

                submitForm(this, {
                    full_name: document.getElementById('regName').value.trim(),
                    email: document.getElementById('regEmail').value.trim(),
                    phone_number: document.getElementById('regPhone').value.trim()
                }, document.getElementById('registerStatus'));
            }
        );
    </script>
</body>
</html>
