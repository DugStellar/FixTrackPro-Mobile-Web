<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cape IT Assist | FixTrack Pro</title>
    <style>
        :root {
            --primary: #0056b3;
            --dark: #1e293b;
            --light: #f8fafc;
            --accent: #0284c7;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light);
            color: var(--dark);
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        h2 { color: var(--primary); }
        .form-group {
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        button:hover { background-color: var(--accent); }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cape IT Assist - FixTrack Pro</h1>
        <p>Client Repair Workflows & Event Registration Portal</p>
    </header>

    <div class="container grid">
        <!-- Event RSVP Section -->
        <div class="card">
            <h2>Event RSVP</h2>
            <form id="rsvpForm">
                <div class="form-group">
                    <label for="rsvpName">Full Name</label>
                    <input type="text" id="rsvpName" required placeholder="e.g. John Doe">
                </div>
                <div class="form-group">
                    <label for="rsvpEmail">Email Address</label>
                    <input type="email" id="rsvpEmail" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label for="attending">Attending Event?</label>
                    <select id="attending">
                        <option value="Yes">Yes, I will attend</option>
                        <option value="No">No, I cannot attend</option>
                    </select>
                </div>
                <button type="submit">Submit RSVP</button>
            </form>
        </div>

        <!-- Non-Invited Client Registration -->
        <div class="card">
            <h2>New Client Registration</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" required placeholder="e.g. Jane Smith">
                </div>
                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" required placeholder="jane@example.com">
                </div>
                <div class="form-group">
                    <label for="regPhone">Phone Number</label>
                    <input type="tel" id="regPhone" required placeholder="082 123 4567">
                </div>
                <button type="submit">Register Account</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('rsvpForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('RSVP Submitted Successfully!');
        });

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Registration Submitted Successfully!');
        });
    </script>
</body>
</html>
